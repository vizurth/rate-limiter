volumes:
  redis_data:
  postgres_data:

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: rate-limiter
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: rate-limiter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data